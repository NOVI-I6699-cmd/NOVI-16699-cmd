<!DOCTYPE html><html><head><meta charset="UTF-8"><title>NOVI LLC - $150 Audit</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#0a0a0a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#111;border:1px solid #222;padding:32px;border-radius:16px;width:90%;max-width:420px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#000;color:white;box-sizing:border-box}button{width:100%;padding:14px;background:white;color:black;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:12px}#status{font-size:13px;margin-top:12px}</style></head><body><div class="card"><h2>Get Your $150 Audit</h2><p style="color:#888;font-size:14px">5-min Loom — delivered in 90 mins from hello@novi-llc.com</p><input id="email" type="email" placeholder="Your work email"><input id="shopify" type="text" placeholder="Shopify URL"><button id="btn" onclick="submitAudit()">Get My Audit →</button><p id="status"></p></div><script>async function submitAudit(){const e=document.getElementById('email').value,s=document.getElementById('shopify').value,b=document.getElementById('btn'),st=document.getElementById('status');if(!e||!s){st.innerText='Fill both fields';return}b.innerText='Sending...';try{const r=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,shopify_url:s})});const d=await r.json();if(r.ok){st.style.color='#4ade80';st.innerText='✅ Got it! Check Primary inbox in 2 mins from hello@novi-llc.com';b.innerText='Sent ✓';}else{st.style.color='#f87171';st.innerText='Error: '+(d.message||'try again');b.innerText='Try Again';}}catch(err){st.innerText='Network error';b.innerText='Try Again';}}</script></body></html>
